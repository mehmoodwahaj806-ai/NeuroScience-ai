seed: 42

preprocessing:
  target_size: [224, 224]
  interpolation: area
  intensity_clip_percentiles: [1.0, 99.0]
  grayscale_to_3channel: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  min_valid_resolution: [32, 32]

ood_detection:
  confidence_floor: 0.85
  uncertain_band: 0.10

augmentation:
  rotation_deg: 10
  translate_pct: 0.05
  scale_range: [0.95, 1.05]
  brightness_contrast: 0.10
  gaussian_noise_var: [0.0, 0.01]
  horizontal_flip: false
